[project]
name = "jev-prompts"
version = "0.1.0"
description = "Jev プロンプト実験の CLI と評価パイプライン"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "polars>=1.0",
    "typer>=0.15",
]

[project.scripts]
jev-prompts = "jev_prompts.report.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8",
    "radon>=6.0.1",
    "reuse>=5",
    "ruff>=0.9",
    "xenon>=0.9.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "scripts"]
line-length = 88
# Ruff 0.16 は markdown 内の Python も見る。source-of-truth は編集禁止のため py のみ対象にする。
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
    "pyproject.toml",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.lint.isort]
known-first-party = ["jev_prompts"]

# 複雑度ゲートの正本。Xenon 0.9.3 は pyproject を読まないため
# scripts/check_complexity.py がここを読んで実行する。緩める変更は CODEOWNERS 対象。
[tool.xenon]
max_absolute = "C"
max_modules = "B"
max_average = "A"
paths = ["src", "scripts", "tests"]

[tool.radon]
cc_min = "A"
show_complexity = true

[tool.importlinter]
root_package = "jev_prompts"

[[tool.importlinter.contracts]]
name = "ARCHITECTURE のパッケージレイヤ"
type = "layers"
containers = ["jev_prompts"]
layers = [
    "report",
    "stats",
    "metrics",
    "runners",
    "prompts",
    "clients",
    "data",
    "config",
]
exhaustive = true
exhaustive_ignores = ["__main__"]
