[project]
name = "jev-prompts"
version = "0.1.0"
description = "Jev プロンプト実験の CLI と評価パイプライン"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "typer>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "reuse>=5",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "scripts"]
line-length = 88
# Ruff 0.16 は markdown 内の Python も見る。source-of-truth は編集禁止のため py のみ対象にする。
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
    "pyproject.toml",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.lint.isort]
known-first-party = ["jev_prompts"]
